<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Do You Miss Me?</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Floating hearts background -->
    <div class="hearts" id="hearts"></div>

    <div class="card">
      <div class="photos">
        <img src="her.jpg" alt="Her" class="photo" />
        <div class="heart-icon">❤</div>
        <img src="me.jpg" alt="Me" class="photo" />
      </div>

      <h1 class="question">Do you miss me?</h1>

      <div class="buttons">
        <button id="yesBtn" class="btn yes">Yes 💕</button>
        <button id="noBtn" class="btn no">No</button>
      </div>
    </div>

    <!-- Celebration overlay (hidden until Yes) -->
    <div class="celebration" id="celebration">
      <h1>I knew it 🥰</h1>
      <p>I miss you too.</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
